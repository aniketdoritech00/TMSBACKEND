# =========================================================
# DATABASE 1 - TMS
# =========================================================
spring.datasource.jdbc-url=jdbc:mysql://localhost:3306/tms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# DATABASE 2 - ERP
# =========================================================
erp.datasource.jdbc-url=jdbc:mysql://localhost:3306/erp_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
erp.datasource.username=root
erp.datasource.password=root
erp.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA
# =========================================================
# Global default. Individual database configs override this.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework=INFO
logging.level.com.doritech.tmsservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG


# =========================================================
# SPRING
# =========================================================
spring.main.allow-circular-references=true


# =========================================================
# MAIL
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=testingcomplaint970@gmail.com
spring.mail.password=YOUR_GMAIL_APP_PASSWORD

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# FILE STORAGE
# =========================================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

file.upload.video-path=D:/TMSDoritech
file.upload.document-path=D:/TMSDoritech
file.upload.max-size-mb=500
